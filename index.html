<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alight Motion Zig-Zag</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#f5f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
    .glow{position:fixed;width:60vmin;height:60vmin;border-radius:50%;background:radial-gradient(circle,#6537ff66,transparent 70%);filter:blur(12px);top:8%;left:20%;pointer-events:none}
    main{position:relative;text-align:center;padding:2rem;max-width:850px} .tag{letter-spacing:.25em;text-transform:uppercase;color:#a9b7ff;font-size:.78rem}
    h1{font-size:clamp(2.4rem,8vw,5.8rem);line-height:1.02;margin:.7rem 0 1rem;font-weight:900;letter-spacing:-.05em}
    h1 span{background:linear-gradient(90deg,#66e3ff,#bd7bff,#ff77b7);-webkit-background-clip:text;background-clip:text;color:transparent}
    p{color:#bac4db;font-size:1.05rem;line-height:1.7;margin:0 auto 1.5rem;max-width:560px}
    .zig{height:6px;width:min(420px,75vw);margin:2rem auto;background:linear-gradient(90deg,#66e3ff,#bd7bff,#ff77b7);clip-path:polygon(0 0,12% 0,20% 100%,32% 0,44% 100%,56% 0,68% 100%,80% 0,100% 0,100% 100%,0 100%);filter:drop-shadow(0 0 15px #8a73ff)}
    a{display:inline-block;padding:.85rem 1.2rem;border:1px solid #6976a3;border-radius:999px;color:#fff;text-decoration:none;font-weight:650}a:hover{background:#ffffff12}
    footer{margin-top:2rem;font-size:.8rem;color:#7783a3}
  </style>
</head>
<body><div class="glow"></div><main>
  <div class="tag">Motion • Edits • Creativity</div>
  <h1>ALIGHT MOTION<br><span>ZIG-ZAG</span></h1>
  <div class="zig"></div>
  <p>A clean landing page for the Alight Motion Zig-Zag project. Replace this starter page with your own animations, edits, previews, and project links.</p>
  <a href="https://github.com/aneeshsinha82-design/ALIGHT-MOTION-ZIG-ZAG">View GitHub Repository ↗</a>
  <footer>Made for creative experiments.</footer>
</main></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zig-Zag Character Intro Maker</title>
<style>
:root{--bg:#0a0b0a;--panel:#121413;--line:#252a27;--tx:#e9ece9;--mu:#8b948e;--ac:#2bd47d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
.app{display:grid;grid-template-columns:380px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px;overflow:auto;max-height:100vh}
h1{font:600 20px/1 Georgia,serif;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px}
h1 b{color:var(--ac)}
.sub{color:var(--mu);font-size:12px;margin-bottom:16px}
h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mu);margin:20px 0 8px;border-top:1px solid var(--line);padding-top:14px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:7px 0;color:var(--mu);font-size:13px}
input,select,button{font:inherit;color:var(--tx);background:#1a1d1b;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input[type=text]{width:160px}input[type=range]{width:160px;padding:0}input[type=color]{padding:0;width:36px;height:26px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ac)}
button{cursor:pointer}button:hover{border-color:var(--ac)}
.pri{background:var(--ac);color:#04140b;border-color:var(--ac);font-weight:700;padding:9px 14px}
.drop{border:1.5px dashed #3a423d;border-radius:10px;padding:16px;text-align:center;color:var(--mu);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--ac);color:var(--tx)}
.chars{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.ch{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;background:#171a18;border:1px solid var(--line);border-radius:8px;padding:5px}
.ch img{width:44px;height:44px;object-fit:contain;background:repeating-conic-gradient(#222 0 25%,#2c2c2c 0 50%) 0 0/10px 10px;border-radius:4px}
.ch input{width:100%}.ch div{display:flex;gap:2px}.ch button{padding:2px 6px}
main{padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center}
.stage{width:100%;max-width:1000px;display:flex;justify-content:center}
canvas{max-width:100%;max-height:68vh;border:1px solid var(--line);border-radius:6px;background:#000}
.bar{display:flex;gap:10px;align-items:center;width:100%;max-width:1000px}
.bar input[type=range]{flex:1;width:auto}
#st{color:var(--mu);font-size:12px;min-height:18px}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{max-height:none;border-right:0}}
</style></head><body>
<div class="app">
<aside>
<h1>Zig<b>·</b>Zag Intro</h1><div class="sub">Character reveal video maker — upload cut-outs, get the intro.</div>
<div class="drop" id="drop">Drop transparent PNGs here<br><small>or tap to choose — as many as you like. File name becomes the character name.</small></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<div class="chars" id="list"></div>

<h2>Background (shared)</h2>
<label>Style<select id="bgMode"><option value="solid">Solid / gradient</option><option value="image">Uploaded image</option></select></label>
<label>Colour A<input type="color" id="c1" value="#0b0b0b"></label>
<label>Colour B<input type="color" id="c2" value="#000000"></label>
<label>Image<input type="file" id="bgFile" accept="image/*" style="width:160px"></label>
<label>Background blur<input type="range" id="bgBlur" min="0" max="20" value="6"></label>
<label>Vignette<input type="range" id="vig" min="0" max="100" value="70"></label>

<h2>Look</h2>
<label>Black &amp; white characters<input type="checkbox" id="bw" checked></label>
<label>Accent colour<input type="color" id="ac" value="#1fb86a"></label>
<label>Name font<select id="font"><option value="Segoe UI, Helvetica, Arial, sans-serif">Clean sans</option><option value="Georgia, serif">Serif</option><option value="Impact, Haettenschweiler, sans-serif">Impact</option><option value="Courier New, monospace">Mono</option></select></label>
<label>Name size<input type="range" id="nsize" min="20" max="80" value="40"></label>
<label>Letter spacing<input type="range" id="lsp" min="0" max="40" value="16"></label>
<label>Zig-zag swoosh lines<input type="checkbox" id="swoosh" checked></label>
<label>Watermark<input type="text" id="wm" value="" placeholder="your channel"></label>

<h2>Timing &amp; format</h2>
<label>Seconds per character<input type="range" id="dur" min="1" max="5" step="0.1" value="2"></label>
<label>Frame<select id="ratio"><option value="1280x720">16:9 landscape</option><option value="720x1280">9:16 vertical</option><option value="1080x1080">1:1 square</option></select></label>
<label>Music (optional)<input type="file" id="aFile" accept="audio/*" style="width:160px"></label>

<h2>Final title card</h2>
<label>Show title<input type="checkbox" id="tOn" checked></label>
<label>Title<input type="text" id="tx" value="My Series"></label>
<label>Tile style (first 2 letters boxed)<input type="checkbox" id="tile" checked></label>
</aside>
<main>
<div class="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
<div class="bar"><button id="play">▶ Play</button><input type="range" id="scrub" min="0" max="1000" value="0"><span id="tm">0.0s</span></div>
<div class="bar"><button class="pri" id="exp">⬇ Export video</button><span id="st">Add characters to begin.</span></div>
</main></div>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
let chars=[],bgImg=null,t=0,playing=false,last=0,exporting=false,aUrl=null;
const aud=new Audio();aud.crossOrigin='anonymous';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,k)=>a+(b-a)*k;
const ease=x=>1-Math.pow(1-clamp(x),3);
const E=0.9, TITLE=3;
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},easeO=x=>1-Math.pow(1-clamp(x),4);
const O=()=>({bw:$('bw').checked,ac:$('ac').value,font:$('font').value,ns:+$('nsize').value,ls:+$('lsp').value,dur:+$('dur').value,sw:$('swoosh').checked,wm:$('wm').value,tOn:$('tOn').checked,tx:$('tx').value,tile:$('tile').checked,mode:$('bgMode').value,c1:$('c1').value,c2:$('c2').value,bb:+$('bgBlur').value,vig:+$('vig').value});
const total=()=>{const o=O();return Math.max(1,chars.length*o.dur+(o.tOn&&chars.length?TITLE:0))};

/* ---------- uploads ---------- */
function addFiles(fs){[...fs].filter(f=>f.type.startsWith('image/')).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).forEach(f=>{
 const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{chars.push({img:im,url,name:f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim()});renderList();draw()};im.src=url});}
const drop=$('drop');drop.onclick=()=>$('file').click();$('file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
['dragover','dragenter'].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
function renderList(){const L=$('list');L.innerHTML='';chars.forEach((c,i)=>{const d=document.createElement('div');d.className='ch';
 d.innerHTML=`<img src="${c.url}"><input type="text" value="${c.name.replace(/"/g,'&quot;')}"><div><button>↑</button><button>↓</button><button>✕</button></div>`;
 d.querySelector('input').oninput=e=>{c.name=e.target.value;draw()};
 const b=d.querySelectorAll('button');
 b[0].onclick=()=>{if(i){[chars[i-1],chars[i]]=[chars[i],chars[i-1]];renderList();draw()}};
 b[1].onclick=()=>{if(i<chars.length-1){[chars[i+1],chars[i]]=[chars[i],chars[i+1]];renderList();draw()}};
 b[2].onclick=()=>{chars.splice(i,1);renderList();draw()};L.appendChild(d)});
 $('st').textContent=chars.length?chars.length+' character(s) · '+total().toFixed(1)+'s video':'Add characters to begin.'}
$('bgFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{bgImg=im;$('bgMode').value='image';draw()};im.src=URL.createObjectURL(f)};
$('aFile').onchange=e=>{const f=e.target.files[0];if(f){if(aUrl)URL.revokeObjectURL(aUrl);aUrl=URL.createObjectURL(f);aud.src=aUrl}};
document.querySelectorAll('aside input,aside select').forEach(el=>{if(el.type!=='file')el.addEventListener('input',()=>{if(el.id==='ratio'){const[w,h]=el.value.split('x');cv.width=+w;cv.height=+h}renderList();draw()})});

/* ---------- rendering ---------- */
function bg(o,W,H){
 if(o.mode==='image'&&bgImg){const s=Math.max(W/bgImg.width,H/bgImg.height)*1.08,w=bgImg.width*s,h=bgImg.height*s,dz=1+Math.sin(t*.3)*.01;
  ctx.save();ctx.filter=`blur(${o.bb}px) brightness(.7)`;ctx.translate(W/2,H/2);ctx.scale(dz,dz);ctx.drawImage(bgImg,-w/2,-h/2,w,h);ctx.restore();}
 else{const g=ctx.createRadialGradient(W*.5,H*.45,0,W*.5,H*.5,Math.max(W,H)*.75);g.addColorStop(0,o.c1);g.addColorStop(1,o.c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
 if(o.vig){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${o.vig/100})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}}
/* Virtual camera: characters stand at zig-zag spots in a 3-D scene (alternating sides, each one deeper than the last).
   The camera pans side to side and dollies forward past them; depth gives scale, parallax and focus blur. */
const XW=.28,PAN=.08,DZ=.3,AL=[1,.8,.45,.3,.22,.17,.13,.1,0],BR=[1,.78,.55,.45,.38,.34,.3,.3,.3];
const tb=(arr,a)=>{a=clamp(a,0,arr.length-1.001);const i=Math.floor(a);return lerp(arr[i],arr[i+1],a-i)};
const portrait=()=>cv.height>cv.width;
function drawChar(c,j,age,u,o,W,H,D,camX){
 const sg=j%2?-1:1,pf=portrait()?.6:1,im=c.img,sc=1/(1+DZ*age),x=W*(.5+(sg*XW-camX)*sc*pf);
 const a=age<0?clamp((age+1.02)/.35):tb(AL,age),bl=age<0?-age*11:Math.min(16,2.5*Math.pow(age,1.3)),br=tb(BR,age),gr=o.bw?easeIO((t-j*D-.3)/.9):0;
 if(a<=.01)return;
 const s=Math.min(H*.95/im.height,W*(portrait()?.95:.55)/im.width)*sc,w=im.width*s,h=im.height*s,y=H*1.02-h+H*Math.min(.12,.03*Math.max(0,age));
 ctx.save();ctx.globalAlpha=clamp(a);const f=[];if(bl>.3)f.push(`blur(${bl*W/1280}px)`);if(gr>0)f.push(`grayscale(${gr})`);f.push(`brightness(${br})`);
 ctx.filter=f.join(' ');ctx.drawImage(im,x-w/2,y,w,h);ctx.restore()}
function swoosh(j,lt,o,W,H){
 const p=clamp((lt-.1)/1.4);if(p<=0||p>=1.3)return;const dir=j%2?-1:1,pts=70,head=p,tail=Math.max(0,p-.45);
 const P=s=>({x:W*(.5+dir*(.62-1.24*s)),y:H*(.56+.14*Math.sin(s*Math.PI*2+j))});
 ctx.save();ctx.lineCap='round';ctx.lineWidth=Math.max(1.5,W/650);
 for(let i=0;i<pts;i++){const s0=lerp(tail,Math.min(head,1),i/pts),s1=lerp(tail,Math.min(head,1),(i+1)/pts),A=P(s0),B=P(s1);
  ctx.globalAlpha=(i/pts)*.7*(1-clamp((p-1)/.25));ctx.strokeStyle=j%2?'#e8e8e8':o.ac;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke()}ctx.restore()}
function nameTag(c,j,lt,o,W,H,D){
 const txt=c.name;if(!txt)return;const fs=o.ns*W/1280;ctx.save();ctx.font=`300 ${fs}px ${o.font}`;ctx.textBaseline='alphabetic';
 const sp=o.ls*W/1280,ch=[...txt],ws=ch.map(x=>ctx.measureText(x).width+sp),tw=ws.reduce((a,b)=>a+b,0)-sp;
 const cx=portrait()?W*.5:W*(j%2===0?.4:.6),x0=cx-tw/2,y=H*(portrait()?.86:.8);
 const out=1-ease((lt-(D-.3))/.3),n=clamp((lt-.3)/.7)*ch.length;let x=x0;
 ctx.fillStyle='#d9dcd9';
 ch.forEach((l,i)=>{ctx.globalAlpha=clamp(n-i)*.9*out;ctx.fillText(l,x,y);x+=ws[i]});
 const u=ease((lt-.45)/.7);ctx.globalAlpha=out;ctx.strokeStyle=o.ac;ctx.lineWidth=Math.max(2,3*W/1280);ctx.shadowColor=o.ac;ctx.shadowBlur=10;
 ctx.beginPath();ctx.moveTo(x0,y+fs*.35);ctx.lineTo(x0+tw*u,y+fs*.35);ctx.stroke();ctx.restore()}
function titleCard(o,lt,W,H){
 const p=ease(lt/.8),words=o.tx.trim().split(/\s+/).filter(Boolean);if(!words.length)return;
 const fs=Math.min(H*.16,W*.11)*(portrait()?.9:1),lh=fs*1.1;ctx.save();ctx.globalAlpha=p;ctx.translate(0,(1-p)*20);
 ctx.font=`${o.tile?'600':'700'} ${fs}px Georgia, serif`;ctx.textBaseline='middle';
 const x0=portrait()?W*.18:W*.12,y0=H*.5-(words.length-1)*lh/2;
 words.forEach((w,i)=>{let x=x0;const y=y0+i*lh;
  [...w].forEach((l,k)=>{const lw=ctx.measureText(l).width;
   if(o.tile&&k<2){const pad=fs*.07;ctx.fillStyle=o.ac;ctx.fillRect(x-pad,y-fs*.5,lw+pad*2,fs);ctx.fillStyle='#fff';ctx.fillText(l,x,y);x+=lw+pad*2+2}
   else{ctx.fillStyle='#e6e6e6';ctx.fillText(l,x,y);x+=lw+(o.tile?2:0)}})});ctx.restore()}
function draw(){
 const W=cv.width,H=cv.height,o=O();ctx.clearRect(0,0,W,H);ctx.filter='none';ctx.globalAlpha=1;bg(o,W,H);
 const n=chars.length;if(!n){ctx.fillStyle='#555';ctx.font=`${W/40}px sans-serif`;ctx.textAlign='center';ctx.fillText('Upload character PNGs to start',W/2,H/2);ctx.textAlign='left';return}
 const D=o.dur,cur=Math.min(n-1,Math.floor(t/D)),items=[];
 const m=Math.floor(t/D),uu=t-m*D,cc=m-1+easeIO(uu/E)+.06*(1-easeIO(uu/E))+.06*clamp(uu/D);
 const ci=Math.floor(cc),ck=cc-ci,sgi=ci%2?-1:1,camX=PAN*sgi*(1-2*ck)+Math.sin(t*.8)*.004,roll=-.012*sgi*Math.sin(ck*Math.PI);
 for(let j=0;j<n;j++){const u=t-j*D,age=cc-j;if(age<-1.02||age>=8)continue;
  items.push([j,age,u])}
 items.sort((a,b)=>b[1]-a[1]);
 ctx.save();ctx.translate(W/2,H/2);ctx.rotate(roll);ctx.translate(-W/2,-H/2);
 items.filter(q=>q[1]>=.5).forEach(([j,age,u])=>drawChar(chars[j],j,age,u,o,W,H,D,camX));
 if(o.sw&&!(o.tOn&&t-n*D>=0))swoosh(cur,t-cur*D,o,W,H);
 items.filter(q=>q[1]<.5).forEach(([j,age,u])=>drawChar(chars[j],j,age,u,o,W,H,D,camX));
 ctx.restore();
 const tt=t-n*D,showT=o.tOn&&tt>=0;
 if(showT){ctx.fillStyle=`rgba(0,0,0,${.45*ease(tt/.6)})`;ctx.fillRect(0,0,W,H);titleCard(o,tt,W,H)}
 else{const lt=t-cur*D;nameTag(chars[cur],cur,lt,o,W,H,D)}
 if(o.wm){ctx.save();ctx.font=`800 ${W/45}px Arial Black, Arial, sans-serif`;ctx.textAlign='right';ctx.fillStyle='rgba(120,255,180,.22)';ctx.fillText(o.wm.toUpperCase(),W*.96,H*.94);ctx.restore()}}

/* ---------- playback ---------- */
function loop(now){if(playing){t+=(now-last)/1000;last=now;if(t>=total()){t=total();stop()}ui();draw()}requestAnimationFrame(loop)}
function ui(){$('scrub').value=t/total()*1000;$('tm').textContent=t.toFixed(1)+'s / '+total().toFixed(1)+'s'}
function stop(){playing=false;aud.pause();$('play').textContent='▶ Play'}
$('play').onclick=()=>{if(!chars.length||exporting)return;if(playing)return stop();if(t>=total()-.05)t=0;playing=true;last=performance.now();$('play').textContent='❚❚ Pause';if(aud.src){aud.currentTime=t;aud.play().catch(()=>{})}};
$('scrub').oninput=e=>{t=e.target.value/1000*total();ui();draw()};
requestAnimationFrame(loop);

/* ---------- export ---------- */
let ac,adest;
$('exp').onclick=async()=>{
 if(!chars.length||exporting)return;if(!window.MediaRecorder)return $('st').textContent='This browser can’t record video. Use desktop Chrome or Edge.';
 stop();exporting=true;$('exp').disabled=true;
 const fps=30,stream=cv.captureStream(fps);
 if(aud.src){try{ac=ac||new AudioContext();if(!aud._src){aud._src=ac.createMediaElementSource(aud);adest=ac.createMediaStreamDestination();aud._src.connect(adest);aud._src.connect(ac.destination)}
  await ac.resume();adest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));aud.currentTime=0;aud.muted=false}catch(e){}}
 const mimes=['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
 const mime=mimes.find(m=>MediaRecorder.isTypeSupported(m))||'';
 const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8e6}),chunks=[];
 rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 const done=new Promise(r=>rec.onstop=r);t=0;draw();rec.start(250);if(aud.src)aud.play().catch(()=>{});
 const T=total(),t0=performance.now();
 await new Promise(res=>{(function step(){t=Math.min(T,(performance.now()-t0)/1000);draw();ui();$('st').textContent='Recording… '+Math.round(t/T*100)+'% (keep this tab open)';
  if(t<T)requestAnimationFrame(step);else res()})()});
 await new Promise(r=>setTimeout(r,300));rec.stop();aud.pause();await done;
 const ext=mime.includes('mp4')?'mp4':'webm',a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob(chunks,{type:mime||'video/webm'}));a.download='character-intro.'+ext;a.click();
 exporting=false;$('exp').disabled=false;$('st').textContent='Done — saved character-intro.'+ext+(ext==='webm'?' (import into Alight Motion, or convert to MP4).':'.')};
renderList();draw();
</script></body></html>
